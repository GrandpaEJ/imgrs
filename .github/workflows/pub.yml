  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build wheels with maturin
        run: |
          maturin build --release --out dist --find-interpreter

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-android:
    name: Build Android wheels
    runs-on: ubuntu-latest
    # needs: test
    strategy:
      matrix:
        target:
          - aarch64-linux-android
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
  
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
  
      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26
          add-to-path: true
          local-cache: true
  
      - name: Add Android Rust target
        run: |
          rustup target add aarch64-linux-android
  
      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install maturin
  
      - name: Build Android wheel
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          PYO3_NO_PYTHON: "1"
          PYO3_CONFIG_FILE: /dev/null
        run: |
          echo "Using NDK at $ANDROID_NDK"
          export CC_aarch64_linux_android="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CFLAGS="--sysroot=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export RUSTFLAGS="-C linker=$CC_aarch64_linux_android -C link-arg=-fuse-ld=lld"
  
          maturin build --release --target ${{ matrix.target }} --out dist --compatibility manylinux2014
  
      - name: Upload Android wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-android-${{ matrix.target }}
          path: dist/*.whl


  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-android] # removed test, from list
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true

      - name: Display structure of files
        run: ls -R dist/

      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install maturin
          maturin upload --non-interactive --skip-existing dist/*

      # 🟢 Upload Android wheels to GitHub release
      - name: Upload Android wheels to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-linux-android*.whl
