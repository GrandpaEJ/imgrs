name: PUBLISH TO PYPI

# Manual trigger only - no auto-run
on:
  workflow_dispatch:

jobs:
  # Build wheels for Linux x86_64 only (CPython)
  build-linux:
    name: Build Linux x86_64 Wheels
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build Linux x86_64 wheels (CPython only)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter --features pyo3/extension-module
          sccache: 'true'
          manylinux: auto

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist/*.whl
          retention-days: 7

  # Build source distribution
  build-sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  # Publish to PyPI after all builds complete
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-linux, build-sdist]
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Consolidate distributions
        run: |
          mkdir -p dist
          find dist-all -name "*.whl" -exec cp {} dist/ \;
          find dist-all -name "*.tar.gz" -exec cp {} dist/ \;
          ls -lh dist/
          echo "Total wheels and sdist:"
          ls dist/ | wc -l

      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install maturin
          # Publish all wheels and sdist to PyPI
          maturin upload --skip-existing dist/*

      - name: Upload all distributions
        uses: actions/upload-artifact@v4
        with:
          name: published-distributions
          path: dist/
          retention-days: 30

  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    
    steps:
      - name: Print Summary
        run: |
          echo "🎉 Successfully published to PyPI!"
          echo ""
          echo "✅ Built and published:"
          echo "  • Linux x86_64 wheel (CPython) - manylinux"
          echo "  • Source distribution (sdist)"
          echo ""
          echo "Users can now install with: pip install imgrs"
          echo "No compilation needed - pre-built Linux wheel available!"
