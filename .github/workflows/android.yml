name: Android Build
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android:
    name: Android Rust Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      NDK_VERSION: 26.1.10909125

      # Disable all Python linking (PyO3 / maturin safe)
      PYO3_NO_PYTHON: "1"
      PYO3_CROSS: "1"
      PYTHON_SYS_EXECUTABLE: "no-python"

      CARGO_TERM_COLOR: always

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - uses: actions/checkout@v4

      # -------------------------
      # System Deps
      # -------------------------
      - name: Install host packages
        run: |
          sudo apt update
          sudo apt install -y unzip wget clang cmake make libssl-dev

      # -------------------------
      # Android SDK + NDK
      # -------------------------
      - name: Install Android SDK + NDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT

          wget https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O tools.zip
          unzip -oq tools.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest || true

          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;$NDK_VERSION"

      # -------------------------
      # Rust + Targets
      # -------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # -------------------------
      # Cache
      # -------------------------
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}

      # -------------------------
      # Android Build
      # -------------------------
      - name: Build Android shared libraries
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          echo "NDK = $ANDROID_NDK_HOME"
          echo "Targets: arm64-v8a, armeabi-v7a, x86_64"

          # arm64
          cargo ndk -t arm64-v8a -o target/android build --release --no-default-features || true

          # armv7
          cargo ndk -t armeabi-v7a -o target/android build --release --no-default-features || true

          # x64
          cargo ndk -t x86_64 -o target/android build --release --no-default-features || true

      # -------------------------
      # Strip binaries (smaller size)
      # -------------------------
      - name: Strip native libs
        run: |
          find target/android -name "*.so" -exec llvm-strip {} \; || true

      # -------------------------
      # Upload Artifacts
      # -------------------------
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-native-libs
          path: target/android/**/*.so
