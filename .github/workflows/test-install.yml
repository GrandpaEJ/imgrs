name: Test Installation (No Rust Required)

# Test that users can install without Rust
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'pyproject.toml'

jobs:
  test-install-from-pypi:
    name: Test Install from PyPI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify NO Rust installed
        run: |
          # This should fail - we want to ensure Rust is NOT available
          rustc --version && exit 1 || echo "✅ Good: Rust not found (as expected)"
        shell: bash
        continue-on-error: true

      - name: Install imgrs from PyPI
        run: |
          pip install --upgrade pip
          pip install imgrs
        
      - name: Test basic import (no NumPy)
        run: |
          python -c "
          import imgrs
          print('✅ imgrs imported successfully')
          print(f'Version: {imgrs.__version__}')
          
          # Test basic operations without NumPy
          img = imgrs.Image.new('RGB', (100, 100), (255, 0, 0))
          print(f'✅ Created image: {img.width}x{img.height}')
          
          img = img.resize((50, 50))
          print(f'✅ Resized to: {img.width}x{img.height}')
          
          img = img.blur(5)
          print('✅ Applied blur')
          
          img.save('test.png')
          print('✅ Saved image')
          
          # Test frombytes (no NumPy needed!)
          data = bytes([255,0,0] * 100)
          img2 = imgrs.Image.frombytes('RGB', (10, 10), data)
          print(f'✅ frombytes works: {img2.width}x{img2.height}')
          
          print()
          print('🎉 All tests passed - NO RUST NEEDED!')
          "

      - name: Test with NumPy
        run: |
          pip install numpy
          python -c "
          import imgrs
          import numpy as np
          
          # Test fromarray
          array = np.random.randint(0, 255, (100, 100, 3), dtype=np.uint8)
          img = imgrs.Image.fromarray(array)
          print(f'✅ fromarray works: {img.width}x{img.height}')
          
          print('🎉 NumPy integration works!')
          "

      - name: Summary
        run: |
          echo "✅ Installation successful on ${{ matrix.os }} Python ${{ matrix.python-version }}"
          echo "✅ No Rust compilation needed"
          echo "✅ Pre-built wheels working"
        shell: bash

  test-both-apis:
    name: Test Both APIs (frombytes vs fromarray)
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install imgrs (no NumPy)
        run: pip install imgrs

      - name: Test frombytes (no NumPy)
        run: |
          python -c "
          import imgrs
          
          # Create test data
          width, height = 100, 100
          data = bytearray()
          for y in range(height):
              for x in range(width):
                  r = int((x / width) * 255)
                  g = int((y / height) * 255)
                  b = 128
                  data.extend([r, g, b])
          
          # Create image with frombytes (no NumPy!)
          img = imgrs.Image.frombytes('RGB', (width, height), bytes(data))
          
          # Apply filters
          img = img.blur(5).sharpen(2.0).adjust_brightness(1.2)
          
          print(f'✅ frombytes API: {img.width}x{img.height}')
          print('✅ All filters work without NumPy')
          "

      - name: Install NumPy
        run: pip install numpy

      - name: Test fromarray (with NumPy)
        run: |
          python -c "
          import imgrs
          import numpy as np
          
          # Create test array
          array = np.random.randint(0, 255, (100, 100, 3), dtype=np.uint8)
          
          # Create image with fromarray
          img = imgrs.Image.fromarray(array)
          
          # Apply same filters
          img = img.blur(5).sharpen(2.0).adjust_brightness(1.2)
          
          print(f'✅ fromarray API: {img.width}x{img.height}')
          print('✅ NumPy integration works')
          "

      - name: Summary
        run: |
          echo "✅ Both APIs working"
          echo "  • frombytes() - No NumPy (mobile friendly)"
          echo "  • fromarray() - With NumPy (desktop)"

